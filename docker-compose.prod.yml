# 배포용 풀스택. 실행: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  app:
    build: .
    restart: always
    env_file: .env.prod
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # 이벤트 소비 워커. 앱과 같은 이미지, 실행 명령만 다르다. 죽으면 자동 재시작.
  notification-worker:
    build: .
    restart: always
    env_file: .env.prod
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: python -m app.workers.notification_worker

  fanout-worker:
    build: .
    restart: always
    env_file: .env.prod
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
    command: python -m app.workers.fanout_worker

  postgis:
    image: postgis/postgis:16-3.4
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: always
    volumes:
      - redisdata:/data

  rabbitmq:
    image: rabbitmq:3.13-management
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
